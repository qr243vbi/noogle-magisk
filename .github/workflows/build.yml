name: Build

on:
  push:
    paths:
      - 'src/module-microg/**'
      - '!src/module-microg/module.prop'
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Linux - Install apt dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: git jq sed curl zip
          version: 1.0

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Verify tools
        run: |
          git --version
          jq --version
          sed --version
          curl --version
          zip --version
          python --version

      - name: Run build
        run: |
          bash ./scripts/download-apks.sh
          python3 ./scripts/update-version.py
          bash ./scripts/update-json.sh
          bash ./scripts/build-noogle-microg.sh

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP=$(ls dist/noogle-microg-v*.zip | head -n1)
          TAG=$(basename "$ZIP" .zip | sed 's@noogle-microg-@@g;')
          echo "Release tag: $TAG"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG$"; then
            echo "[I] Tag $TAG already exists"
          else
            echo "[I] Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[I] Updating existing release $TAG"
            gh release delete-asset "$TAG" "$(basename "$ZIP")" --yes || true
            gh release upload "$TAG" "$ZIP" --clobber
          else
            echo "[I] Creating new release $TAG"
            gh release create "$TAG" \
              "$ZIP" \
              --title "Noogle microG $TAG" \
              --generate-notes
          fi

